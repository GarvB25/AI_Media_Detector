<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Media Detector — Verify Reality</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- Animated background grid -->
  <div class="bg-grid"></div>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-container">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 20 L18 24 L26 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="20" r="6" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>
        </svg>
      </div>
      <span class="brand-name">MediaVerify</span>
      <span class="brand-tag">AI DETECTION</span>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <!-- Tab Toggle -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Sign In</button>
        <button class="tab-btn" data-tab="signup">Create Account</button>
        <div class="tab-indicator"></div>
      </div>

      <!-- Login Form -->
      <div class="auth-form" id="loginForm">
        <div class="form-header">
          <h2>Welcome back</h2>
          <p>Analyze media with AI-powered detection</p>
        </div>

        <div class="input-group">
          <label for="loginEmail">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
              <path d="M3 5h14l-7 7-7-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <rect x="2" y="5" width="16" height="11" rx="1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
          </div>
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
              <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
            <button class="toggle-pw" type="button" aria-label="Toggle password visibility">
              <svg viewBox="0 0 20 20" fill="none" class="eye-icon">
                <path d="M10 4C5 4 2 10 2 10s3 6 8 6 8-6 8-6-3-6-8-6z" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="error-msg hidden"></div>

        <button class="btn-primary" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden"></span>
        </button>

        <div class="divider"><span>or continue with</span></div>

        <button class="btn-google" id="googleLoginBtn">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Signup Form -->
      <div class="auth-form hidden" id="signupForm">
        <div class="form-header">
          <h2>Create account</h2>
          <p>Start detecting AI-generated media today</p>
        </div>

        <div class="input-group">
          <label for="signupName">Full Name</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="text" id="signupName" placeholder="John Doe" autocomplete="name" />
          </div>
        </div>

        <div class="input-group">
          <label for="signupEmail">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
              <path d="M3 5h14l-7 7-7-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <rect x="2" y="5" width="16" height="11" rx="1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" />
          </div>
        </div>

        <div class="input-group">
          <label for="signupPassword">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
              <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="password" id="signupPassword" placeholder="Min. 8 characters" autocomplete="new-password" />
            <button class="toggle-pw" type="button">
              <svg viewBox="0 0 20 20" fill="none" class="eye-icon">
                <path d="M10 4C5 4 2 10 2 10s3 6 8 6 8-6 8-6-3-6-8-6z" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
          <!-- Password strength bar -->
          <div class="pw-strength">
            <div class="pw-bar" id="pwBar"></div>
          </div>
          <span class="pw-label" id="pwLabel"></span>
        </div>

        <div id="signupError" class="error-msg hidden"></div>

        <button class="btn-primary" id="signupBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden"></span>
        </button>

        <div class="divider"><span>or continue with</span></div>

        <button class="btn-google" id="googleSignupBtn">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>
    </div>

    <!-- Footer stats -->
    <div class="auth-stats">
      <div class="stat"><span class="stat-num">2M+</span><span class="stat-label">Files Analyzed</span></div>
      <div class="stat-div"></div>
      <div class="stat"><span class="stat-num">99.2%</span><span class="stat-label">Accuracy</span></div>
      <div class="stat-div"></div>
      <div class="stat"><span class="stat-num">150+</span><span class="stat-label">Countries</span></div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
